version: '3.9'

services:
  next:
    build: .
    container_name: next-photo-gallery
    restart: always

    ports:
      - '127.0.0.1:3001:3001'

    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 127.0.0.1
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOADS_DIR: /app/uploads

    volumes:
      - ./uploads:/app/uploads
      - next-cache:/app/.next/cache

    networks:
      - app-network

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  next-cache:

networks:
  app-network:
    external: true
